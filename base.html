<!DOCTYPE html>
<html>
<head>

<style>
  /* Estilo básico para que la tabla se vea limpia */
  table {
    width: 100%;
    border-collapse: collapse; /* Quita el espacio entre bordes */
    font-family: Arial, sans-serif;
  }
  
  th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: left;
  }

  /* Color para el encabezado */
  th {
    background-color: #4CAF50;
    color: white;
  }

  /* Color diferente para filas alternas (cebreado) */
  tr:nth-child(even) {
    background-color: #f2f2f2;
  }
</style>
</head>
<body>
